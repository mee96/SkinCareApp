<div class="auth-card">
  <h1>{{ 'auth.loginTitle' | translate }}</h1>

  @if (error()) {
    <p class="error-msg">{{ error() | translate }}</p>
  }

  <form (ngSubmit)="loginWithEmail()">
    <input
      type="email"
      placeholder="{{ 'auth.emailPlaceholder' | translate }}"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
      required
    />
    <input
      type="password"
      placeholder="{{ 'auth.passwordPlaceholder' | translate }}"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
      required
    />
    <button type="submit" [disabled]="loading()">
      {{ (loading() ? 'auth.loggingIn' : 'auth.submitLogin') | translate }}
    </button>
  </form>

  <div class="divider">{{ 'auth.or' | translate }}</div>

  <button class="google-btn" (click)="loginWithGoogle()" [disabled]="loading()">
    {{ 'auth.continueWithGoogle' | translate }}
  </button>

  <p class="switch-link">
    {{ 'auth.noAccount' | translate }} <a routerLink="/registre">{{ 'auth.signUp' | translate }}</a>
  </p>
</div>
