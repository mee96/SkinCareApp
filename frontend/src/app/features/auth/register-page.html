<div class="auth-card">
  <h1>Crea el teu compte</h1>

  @if (error()) {
    <p class="error-msg">{{ error() }}</p>
  }

  <form (ngSubmit)="registerWithEmail()">
    <input
      type="email"
      placeholder="Correu electrònic"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
      required
    />
    <input
      type="password"
      placeholder="Contrasenya (mín. 6 caràcters)"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
      minlength="6"
      required
    />

    <h2 class="section-title">Tipus de pell</h2>
    <div class="chip-row">
      @for (opt of skinTypeOptions; track opt.value) {
        <button
          type="button"
          class="chip"
          [class.active]="skinType() === opt.value"
          (click)="selectSkinType(opt.value)"
        >
          {{ opt.label }}
        </button>
      }
    </div>

    <h2 class="section-title">Què et preocupa? <span class="optional">(opcional)</span></h2>
    <div class="chip-row">
      @for (opt of concernOptions; track opt.value) {
        <button
          type="button"
          class="chip"
          [class.active]="selectedConcerns().has(opt.value)"
          (click)="toggleConcern(opt.value)"
        >
          {{ opt.emoji }} {{ opt.label }}
        </button>
      }
    </div>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creant compte...' : 'Registra\'t' }}
    </button>
  </form>

  <div class="divider">o</div>

  <button class="google-btn" (click)="registerWithGoogle()" [disabled]="loading()">
    Continua amb Google
  </button>

  <p class="switch-link">
    Ja tens compte? <a routerLink="/login">Inicia sessió</a>
  </p>
</div>
