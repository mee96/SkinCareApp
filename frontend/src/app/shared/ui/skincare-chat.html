<button
  type="button"
  class="chat-fab"
  [attr.aria-label]="'chat.title' | translate"
  (click)="toggle()"
>
  <lucide-icon [img]="MessageCircleIcon" [size]="24" />
</button>

@if (isOpen()) {
  <div class="chat-panel">
    <div class="chat-header">
      <span class="chat-title">{{ 'chat.title' | translate }}</span>
      <button type="button" class="chat-close" aria-label="Tancar" (click)="toggle()">
        <lucide-icon [img]="XIcon" [size]="18" />
      </button>
    </div>

    <div class="chat-messages">
      @for (msg of messages(); track $index) {
        <div class="chat-bubble" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
          {{ msg.content }}
        </div>
      }
      @if (loading()) {
        <div class="chat-bubble assistant thinking">{{ 'chat.thinking' | translate }}</div>
      }
    </div>

    <div class="chat-input-row">
      <input
        class="chat-input"
        type="text"
        name="chatInput"
        [placeholder]="'chat.placeholder' | translate"
        [attr.aria-label]="'chat.placeholder' | translate"
        [ngModel]="input()"
        (ngModelChange)="input.set($event)"
        (keydown.enter)="send()"
      />
      <button
        type="button"
        class="chat-send"
        [attr.aria-label]="'chat.title' | translate"
        [disabled]="loading()"
        (click)="send()"
      >
        <lucide-icon [img]="SendIcon" [size]="18" />
      </button>
    </div>
  </div>
}
